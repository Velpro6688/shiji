name: Windows verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    if: github.ref != 'refs/heads/codex/macos-beta-dawn' && !contains(github.ref, '-beta.')
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run electron:install
      - run: npm run check
      - run: npm run lint -- --max-warnings=0
      - run: npm run verify:all
      - run: npm run verify:onboarding
      - run: npm run verify:corners
      - run: npm run verify:v313
      - run: npm run dist
      - run: node scripts/verify/verify-packed-resources.cjs
      - run: npm run verify:packed-ui
      - name: Install NSIS compiler
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
      - name: Build installer
        run: node scripts/build-installer.cjs
        env:
          NSIS_EXE: C:\Program Files (x86)\NSIS\makensis.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: scripts/verify/results/

  macos-build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run electron:install
      - run: npm run check
      - run: npm run lint -- --max-warnings=0
      - run: npm run verify:planning
      - run: npm run verify:backup-history
      - run: npm run verify:todo
      - run: npm run verify:onboarding
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos-unsigned-test-build
          path: artifacts/mac-build/*.zip
